<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andrew CyberSec Learning Platform - Register page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="bootstrap-5.3.3-dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="general.css">
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <!--Header Start-->
    <header>
        <div class="introduction">
            <h1>Register to Andrew CyberSec Learnig Platform.</h1>
            <div class="logo_image">
                <img src="photos/andrewcybersec.png" alt="andrew cybersec book hub logo image">
            </div>
            <div class="navigation">
                <nav>
                    <a href="index.html">Home</a>
                    <a href="service.html">Services</a>
                    <a href="contact.html">Contact</a>
                    <a href="about.html">About</a>
                </nav>
            </div>
        </div>
    </header>
    <!--Header End-->
    <section>
        <form action="#" method="post">
            <h1>Register</h1>
            <label for="first_name">First Name: </label>
            <input type="text" name="first_name" class="form-control" id="first_name" placeholder="Your First Name..">

            <label for="last_name">Last Name: </label>
            <input type="text" name="last_name" id="last_name" class="form-control" placeholder="Your Last Name..">

            <label for="username">Email Address: </label> <br>
            <input type="email" class="form-control" name="email" id="email" placeholder="Enter your email address">

            <label for="tel">Phone Number (Optional): </label>
            <input type="tel" name="phone_number" id="phone_number" placeholder="+255 745 752 986" class="form-control">

            <label for="password">Enter Password: </label> <br>
            <input type="password1" class="form-control" name="password" id="password1"
                placeholder="Enter your password">

            <label for="password">Re-Enter Password</label>
            <input type="password" name="password2" id="password2" placeholder="Re-Enter Your Password"
                class="form-control">

            <input type="submit" name="submit" value="Submit" class="btn mt-3">
            <a href="login.html" class="btn mt-3">Login page</a>
            <div class="continue">
                <p>Or continue With</p>
                <img src="" alt="goolge account">
            </div>
        </form>
    </section>

    <!--===================== FOOTER =================== -->
    <footer class="footer">
        <div class="container">
            <h5>Connect With Us</h5>
            <div class="social-icons">
                <a href="https://www.youtube.com/@andrewcybersec"><i class="bi bi-youtube"></i></a>
                <a href="#"><i class="bi bi-tiktok"></i></a>
                <a href="#"><i class="bi bi-instagram"></i></a>
                <a href="#"><i class="bi bi-facebook"></i></a>
            </div>
            <p>&copy; 2026 Andrew CyberSec. All rights reserved.</p>
            <p>
                <a href="privacy.html">Privacy Policy</a> |
                <a href="terms.html">Terms of Service</a> |
                <a href="contact.html">Contact Us</a>
            </p>
            <p>Professional, Trusted & Legal Cybersecurity Services</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
